name: OmniNet Python CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The active HTC simulators use Python 3.10+ union type syntax.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest black mypy

      - name: Compile maintained simulation modules and tests
        run: |
          python -m py_compile \
            scripts/omega_htc_sim.py \
            scripts/omega_federation_sim.py \
            tests/test_omega_htc_sim.py \
            tests/test_omega_federation_sim.py

      - name: Lint maintained simulation modules and tests
        run: |
          flake8 scripts/omega_htc_sim.py scripts/omega_federation_sim.py \
            tests/test_omega_htc_sim.py tests/test_omega_federation_sim.py \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run bounded simulation test suite
        run: python -m unittest discover -s tests -p "test_omega_*_sim.py" -v

      - name: Run formatting check on maintained simulation modules
        run: black --check scripts/omega_htc_sim.py scripts/omega_federation_sim.py tests/test_omega_htc_sim.py tests/test_omega_federation_sim.py
