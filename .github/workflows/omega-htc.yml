name: Omega HTC Simulation Tests

on:
  pull_request:
    paths:
      - "scripts/omega_htc_sim.py"
      - "tests/test_omega_htc_sim.py"
      - ".github/workflows/omega-htc.yml"
  push:
    branches:
      - "security/phoenix-preflight-2026-10-09"
    paths:
      - "scripts/omega_htc_sim.py"
      - "tests/test_omega_htc_sim.py"
      - ".github/workflows/omega-htc.yml"

permissions:
  contents: read

jobs:
  simulation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile simulation and tests
        run: python -m py_compile scripts/omega_htc_sim.py tests/test_omega_htc_sim.py
      - name: Run bounded simulation tests
        run: python -m unittest discover -s tests -p "test_omega_htc_sim.py" -v
      - name: Run reproducible sample simulation
        run: python scripts/omega_htc_sim.py --cycles 6 --max-evaluations 63 --seed 1680
